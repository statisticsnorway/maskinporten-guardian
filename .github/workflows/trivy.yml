name: Trivy Security Scan

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  # Scope concurrency per event type so that a push-to-main does not cancel
  # an in-flight pull_request scan.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail build on Critical/High Vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: 1

  trivy-image:
    # The fs scan above only sees Maven dependencies. This job builds the
    # container image and scans it, so OS packages and the JDK from the
    # distroless base image are covered too.
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # Needed to resolve dependencies from the Dapla Maven artifact registry
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: "projects/${{secrets.GAR_PROJECT_NUMBER}}/locations/global/workloadIdentityPools/gh-actions/providers/gh-actions"
          service_account: "gh-actions-dftjen@${{secrets.GAR_PROJECT_ID}}.iam.gserviceaccount.com"

      - name: Build application jar
        run: mvn --batch-mode clean package -DskipTests

      - name: Build container image
        run: docker build -t maskinporten-guardian:scan .

      - name: Fail build on Critical/High Vulnerabilities in image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'maskinporten-guardian:scan'
          format: 'table'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: 1
